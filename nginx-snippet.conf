# Snippet Nginx untuk YOUR_DOMAIN — taruh di dalam server{} domain kamu.
# 1) Matikan eksekusi PHP di storage/ (anti webshell)
location ^~ /dashboard/storage/ {
    alias /www/wwwroot/YOUR_DOMAIN/dashboard/storage/;
    autoindex off;
    location ~ \.php$ { deny all; }
}
# 2) Blokir akses langsung ke data/ (sqlite) dan setup.php setelah setup
location ~ ^/dashboard/(data|setup\.php) { deny all; }
# 3) Batas upload samakan dengan aplikasi
client_max_body_size 50m;
